name: Build and Push Docker Images

on:
  push:
    branches: [ final/distribuited-session-caching ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # Checkout del codice
      - name: Checkout repository
        uses: actions/checkout@v4

      # Login su Azure usando Service Principal con JSON creds
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

       # Login al container registry
      - name: Login to Azure Container Registry
        run: az acr login --name acresamecloud

      # Imposta numero versione automatico
      - name: Set IMAGE_VERSION
        run: echo "IMAGE_VERSION=v${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      # Build & Push marketplace-auth-module
      - name: Build & Push auth-module
        run: |
          docker build \
            -f marketplace-auth-module/Dockerfile \
            -t acresamecloud.azurecr.io/auth-module-marketplace-backend:${IMAGE_VERSION} \
            .
          docker push acresamecloud.azurecr.io/auth-module-marketplace-backend:${IMAGE_VERSION}

      # Build & Push marketplace-backend-api
      - name: Build & Push backend
        run: |
          docker build \
            -f marketplace-backend-api/Dockerfile \
            -t acresamecloud.azurecr.io/backend:${IMAGE_VERSION} \
            .
          docker push acresamecloud.azurecr.io/backend:${IMAGE_VERSION}

      # Build & Push marketplace-frontend
      - name: Build & Push frontend
        run: |
          docker build \
            -f marketplace-frontend/Dockerfile \
            -t acresamecloud.azurecr.io/frontend:${IMAGE_VERSION} \
            .
          docker push acresamecloud.azurecr.io/frontend:${IMAGE_VERSION}

      # Build & Push marketplace-gateway-api
      - name: Build & Push gateway-api
        run: |
          docker build \
            -f marketplace-gateway-api/Dockerfile \
            -t acresamecloud.azurecr.io/api-backend-gateway-marketplace:${IMAGE_VERSION} \
            .
          docker push acresamecloud.azurecr.io/api-backend-gateway-marketplace:${IMAGE_VERSION}
